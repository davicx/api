<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groups</title>

  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--text);
    }

    /* =========================
       Top Bar
       ========================= */
    .topbar {
      position: sticky;
      top: 0;
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 18px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      min-width: 220px;
    }

    .new-btn {
      padding: 8px 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .new-btn:hover {
      filter: brightness(1.05);
    }

    /* =========================
       Page
       ========================= */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    .page h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      font-weight: 600;
    }

    .page p {
      margin: 0 0 24px 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       Groups Grid
       ========================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .group-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .group-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.08);
    }

    .group-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 12px;
    }

    .group-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .group-meta {
      font-size: 13px;
      color: var(--muted);
    }

    /* =========================
       Create Group Card
       ========================= */
    .create-card {
      background: #fafafa;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .create-card:hover {
      background: #f0f2f7;
    }

    .plus {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .create-card span {
      font-weight: 600;
    }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <div class="logo">☁️</div>
      Groups
    </div>

    <div class="top-actions">
      <input class="search" placeholder="Search groups…" />
      <button class="new-btn">+ New Group</button>
    </div>
  </div>

  <!-- Page -->
  <div class="page">
    <h1>Your Groups</h1>
    <p>Groups make it easy to share files, chat, and collaborate.</p>

    <div class="grid">
      <!-- Group -->
      <div class="group-card">
        <div class="group-icon">📁</div>
        <div class="group-title">Design Team</div>
        <div class="group-meta">8 members • 24 files</div>
      </div>

      <div class="group-card">
        <div class="group-icon">📸</div>
        <div class="group-title">Photography</div>
        <div class="group-meta">3 members • 112 files</div>
      </div>

      <div class="group-card">
        <div class="group-icon">🎓</div>
        <div class="group-title">Class Project</div>
        <div class="group-meta">5 members • 9 files</div>
      </div>

      <div class="group-card">
        <div class="group-icon">💼</div>
        <div class="group-title">Startup Docs</div>
        <div class="group-meta">2 members • 41 files</div>
      </div>

      <!-- Create New -->
      <div class="create-card">
        <div class="plus">+</div>
        <span>Create new group</span>
      </div>
    </div>
  </div>

  <script>
    // UI-only placeholders
    document.querySelectorAll('.group-card').forEach(card => {
      card.addEventListener('click', () => {
        alert('Open group (not wired yet)');
      });
    });

    document.querySelector('.create-card').addEventListener('click', () => {
      alert('Create new group (not wired yet)');
    });
  </script>

</body>
</html>
