<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Groups</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background: #f6f7f9;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    /* Top bar */
    .topbar {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
    }

    /* Group cards */
    .group-card {
      border-radius: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      height: 100%;
    }

    .group-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.08);
    }

    .group-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
    }

    .group-meta {
      color: #6b7280;
      font-size: 14px;
    }

    /* Create group card */
    .create-card {
      border: 2px dashed #d1d5db;
      background: #fafafa;
    }

    .create-card:hover {
      background: #f0f2f7;
    }

    .create-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <nav class="topbar py-3">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <div class="brand-logo">☁️</div>
        <span class="fs-5 fw-semibold">Groups</span>
      </div>

      <div class="d-flex align-items-center gap-3">
        <input
          class="form-control"
          style="width: 240px;"
          placeholder="Search groups…"
        />
        <button class="btn btn-primary rounded-pill px-4">
          + New Group
        </button>
      </div>
    </div>
  </nav>

  <!-- Page -->
  <main class="container-fluid px-4 py-4">

    <div class="mb-4">
      <h1 class="fw-semibold">Your Groups</h1>
      <p class="text-muted">
        Groups make it easy to share files, chat, and collaborate.
      </p>
    </div>

    <!-- Groups Grid -->
    <div class="row g-4">

      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card group-card p-4">
          <div class="group-icon">📁</div>
          <h5 class="fw-semibold mb-1">Design Team</h5>
          <div class="group-meta">8 members • 24 files</div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card group-card p-4">
          <div class="group-icon">📸</div>
          <h5 class="fw-semibold mb-1">Photography</h5>
          <div class="group-meta">3 members • 112 files</div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card group-card p-4">
          <div class="group-icon">🎓</div>
          <h5 class="fw-semibold mb-1">Class Project</h5>
          <div class="group-meta">5 members • 9 files</div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card group-card p-4">
          <div class="group-icon">💼</div>
          <h5 class="fw-semibold mb-1">Startup Docs</h5>
          <div class="group-meta">2 members • 41 files</div>
        </div>
      </div>

      <!-- Create New Group -->
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
        <div class="card group-card create-card p-4 text-center">
          <div class="create-icon">+</div>
          <h5 class="fw-semibold mb-1">Create new group</h5>
          <div class="group-meta">Invite people and start sharing</div>
        </div>
      </div>

    </div>
  </main>

  <!-- Bootstrap JS (optional, for dropdowns later) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
